spring.application.name=backend
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/githMind
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# OpenAI Configuration
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.chat-model=gpt-4o-mini
# spring.ai.openai.embedding-model=text-embedding-3-small

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Cookie Configuration
server.servlet.session.cookie.name=GITHMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App Settings
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encryptor-password=${TOKEN_ENCRYPTION_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTION_SALT}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50


