spring.application.name=backend
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/githMind
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Gemini Configuration (Google AI Studio API key - no GCP project required)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.2
# 3.8-flash always thinks; thinking-budget=0 is silently ignored, LOW actually zeroes it.
# Keeps time-to-first-token low for the streaming RAG chat.
spring.ai.google.genai.chat.thinking-level=LOW

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.dimensions=768

# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.provider.github.user-name-attribute=id

# PG Vector Configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# Cookie Configuration
server.servlet.session.cookie.name=GITHMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App Settings
app.frontend.url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000
app.token-encryptor-password=${TOKEN_ENCRYPTION_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTION_SALT}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100

# Embedding throttle + retry. One vectorStore.add() == one embedContent request, so the
# steady-state delay caps request rate; backoff absorbs 429/5xx without failing the job.
app.indexing.embedding-delay-ms=600
app.indexing.embedding-max-attempts=5
app.indexing.embedding-backoff-initial-ms=2000
app.indexing.embedding-backoff-max-ms=60000
app.indexing.embedding-backoff-multiplier=2.0
app.github.api-delay-ms=50


