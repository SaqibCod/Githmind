services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: githmind-postgres
    environment:
      POSTGRES_DB: githMind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      # 5434 on the host: 5433 collides with other local pgvector projects.
      - "5434:5432"
    volumes:
      - githmind_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d githMind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  githmind_pg_data: