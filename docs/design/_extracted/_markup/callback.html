<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>githMind Callback</title>
<script src="d5932fd9-8afd-4db2-b911-ebdfd892af0c"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!--[style stripped]-->
<!--[style stripped]-->
</helmet>
<div data-gm="{{theme}}" class="gm-cb" style="min-height: 560px; box-sizing: border-box; background: radial-gradient(600px 420px at 50% 42%, var(--glow1), transparent 70%), var(--bg); color: var(--text); font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px 24px; text-align: center">

<div style="position: relative; width: 96px; height: 96px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: -30px; border-radius: 50%; background: radial-gradient(circle, var(--halo), transparent 68%); animation: gm-breathe 4s ease-in-out infinite"></div>
<!--[svg 362b]-->
<!--[svg 445b]-->
</div>

<div class="gm-rise" role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 420px">
<h1 class="gm-title" style="margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -0.025em; color: var(--strong)">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted)">{{body}}</p>
</div>

<sc-if value="{{isFailed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<div role="alert" style="padding: 10px 16px; border-radius: 12px; border: 1px solid var(--err-bd); background: var(--err-bg); font-size: 13px; color: var(--err-t)">Session could not be established (401)</div>
<a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 26px; border-radius: 999px; background: var(--cta-bg); color: var(--cta-fg); font-size: 15px; font-weight: 600">Back to sign in</a>
</div>
</sc-if>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 6px" aria-hidden="true"><span style="width: 6px; height: 6px; border-radius: 50%; background: #f5a65b; animation: gm-dots 1.4s ease-in-out infinite"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #f5a65b; animation: gm-dots 1.4s ease-in-out .2s infinite"></span><span style="width: 6px; height: 6px; border-radius: 50%; background: #f5a65b; animation: gm-dots 1.4s ease-in-out .4s infinite"></span></div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); margin-top: 12px">
<span style="font-family: 'Geist Mono', monospace">Preview state</span>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" sc-camel-on-click="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:560}}">
class Component extends DCLogic {
state = { s: 'loading' };
renderVals() {
const s = this.state.s;
const defs = [['loading', 'Signing in'], ['failed', 'Session failed']];
return {
theme: this.props.theme === 'light' ? 'light' : 'dark',
isLoading: s === 'loading',
isFailed: s === 'failed',
ringColor: s === 'failed' ? 'var(--err-bd)' : 'var(--ring)',
spinStyle: s === 'failed' ? 'display: none' : 'transform-origin: 48px 48px; animation: gm-spin 1.3s linear infinite',
title: s === 'failed' ? 'We could not sign you in' : 'Signing you in',
body: s === 'failed' ? 'GitHub approved the request, but your session could not be started. You will be sent back to the sign-in page.' : 'Setting up your session. This only takes a moment.',
tabs: defs.map(([id, label]) => ({
label,
pick: () => this.setState({ s: id }),
style: 'height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer; font-family: Geist Mono, monospace; font-size: 12px; color: ' + (s === id ? 'var(--tab-on-fg)' : 'var(--muted)') + '; background: ' + (s === id ? 'var(--tab-on-bg)' : 'transparent') + '; border: 1px solid var(--line2)'
}))
};
}
}
</script>

</body></html>
